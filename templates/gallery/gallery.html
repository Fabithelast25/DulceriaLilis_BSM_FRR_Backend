<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Galería</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap + SweetAlert -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<link rel="stylesheet" href="{% static 'CSS/gallery.css' %}">

<style>
:root{
  --brand-red:#c8102e; --brand-red-700:#a40d25; --brand-red-50:#fff5f7;
  --brand-gold:#d4af37; --brand-gold-700:#b89617; --brand-gold-100:#fcf6e6;
  --ink:#1c1d22; --border:#e8e8e8; --bg:#ffffff; --page:#fafafa;
  --shadow:0 10px 24px rgba(0,0,0,.08); --radius:14px;
}
html,body{height:100%}
body{
  background: linear-gradient(180deg, var(--page), #fff);
  margin:0; font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif; color:var(--ink);
}
/* Navbar (coincidir con el resto del sitio) */
.navbar{ background: var(--brand-red) !important; box-shadow: 0 8px 18px rgba(200,16,46,.18); }
.navbar-brand{ color:#fff !important; font-weight:800; letter-spacing:.3px; }
.nav-link{ color:#fff !important; opacity:.95; }
.nav-link:hover{ opacity:1; text-decoration: underline; text-underline-offset: 4px; }

/* Card igual al panel */
.page-wrap{ padding:24px; }
.card{
  max-width: 1000px; margin:auto; border-radius:var(--radius);
  border:1px solid var(--border); box-shadow:var(--shadow);
}

.card-header{
  background: linear-gradient(180deg,#fff,var(--brand-gold-100));
  border-bottom:2px solid var(--brand-gold);
  padding:14px 18px; font-weight:800;
}

/* Carrusel */
.carousel-box{
  position:relative;
  text-align:center;
  padding:30px;
}

.slide{
  width:100%;
  max-height:420px;
  object-fit:contain;
  display:none;
  border-radius:12px;
}

.prev,.next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:28px;
  background:var(--brand-red);
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:50%;
}

.prev{ left:5px; }
.next{ right:5px; }

/* Botón corporativo */
.btn-gold{
  background: linear-gradient(180deg, var(--brand-gold), var(--brand-gold-700));
  border:none; font-weight:800;
}
</style>
</head>

<body>

{% include 'gallery/navbarGallery.html' %}

<div class="page-wrap">
<div class="card">

  <div class="card-header d-flex justify-content-between">
    <span>Galería de Imágenes</span>
  </div>

  <div class="card-body">

    <!-- CARRUSEL -->
    <div class="carousel-box">
      <button class="prev" onclick="moveSlide(-1)">❮</button>

      {% for img in static_images %}
        <img class="slide" src="{{ img }}">
      {% endfor %}

      {% for img in db_images %}
        <img class="slide" src="{{ img.image.url }}">
      {% endfor %}

      <button class="next" onclick="moveSlide(1)">❯</button>
    </div>

    <!-- SUBIR IMAGEN -->
    <div class="text-center mt-4">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <input type="file" name="image" id="imageInput" hidden>

            <label for="imageInput" class="btn btn-outline" id="botonImagen">
                Seleccionar imagen
            </label>

            <span id="fileName" class="ms-2 text-muted"></span>

            <br><br>
            <button class="btn btn-gold">Agregar Imagen</button>
        </form>
    </div>

  </div>
</div>
</div>

<script>
let slideIndex = 0;
showSlides();

function moveSlide(n){
  slideIndex += n;
  showSlides();
}

function showSlides(){
  let slides = document.getElementsByClassName("slide");
  if(slides.length === 0) return;

  if(slideIndex >= slides.length) slideIndex = 0;
  if(slideIndex < 0) slideIndex = slides.length-1;

  for(let i=0;i<slides.length;i++){
    slides[i].style.display="none";
  }
  slides[slideIndex].style.display="block";
}
</script>
<script>
document.getElementById("imageInput").addEventListener("change", function(){
    let fileName = this.files[0]?.name || "Ningún archivo seleccionado";
    document.getElementById("fileName").textContent = fileName;
});
</script>

</body>
</html>
